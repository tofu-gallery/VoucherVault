; Tofu (2026-10-27): this file is Tofu's addition; it is not part of upstream VoucherVault.
;
; uWSGI for a Tofu copy, started by tofu-entrypoint.sh (which also sets uid/gid when it runs as root). Upstream's
; docker/docker_uwsgi.ini listens on port 8000 and runs as www-data from the start; a copy listens on PORT, which Tofu
; sets (80 without it), and uWSGI binds it as root before it drops to www-data. Paths are relative to this file, so
; the same file serves a local test run.
[uwsgi]
http-socket = :$(PORT)
chdir = %d
module = myproject.wsgi
master = 1
processes = 2
threads = 2
static-map = /static=%dmyapp/static
disable-logging = true
log-4xx = true
log-5xx = true
buffer-size = 32768
die-on-term = true
